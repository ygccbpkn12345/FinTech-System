[project]
name = "analystverse"
version = "0.2.0"
description = "Multi-agent stock analysis and FinPortfolio integration"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "akshare==1.17.93",
    "chromadb==1.5.5",
    "cryptography>=43,<46",
    "httpx>=0.27,<1",
    "joblib==1.5.2",
    "langchain==1.2.12",
    "langchain_core==1.2.19",
    "langchain_openai==1.1.11",
    "langgraph==1.1.2",
    "numpy==2.4.3",
    "pandas==3.0.1",
    "pytest>=8,<9",
    "scikit_learn==1.8.0",
    "fastapi>=0.136.3,<1",
    "uvicorn>=0.44.0,<1",
    "python-dotenv>=1.2.2",
    "python-multipart>=0.0.9",
    "baostock>=0.8.9",
    "langgraph-prebuilt==1.0.8",
    "tushare>=1.4",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
model = ["torch>=2.12.0"]
