schema_version: "1.0"
id: asacpl
name: ASACPL
version: "1.0"
description: >-
  Stable Sequential Portfolio Learning via Asset Space Compression and State
  Representation。HLB-AS 直方图引导叶子生长筛选候选股票 + CNN 时序特征/
  协方差状态表示 + 异步 Actor-Critic（A3C）动态组合权重优化。
  原始代码不复制、不修改；适配器按论文协议（环境参数、特征 f1-f4、
  A3C 超参）原样驱动训练与测试评估。
paper:
  title: >-
    Stable Sequential Portfolio Learning via Asset Space Compression and
    State Representation
  note: 原论文实验数据支持 SSE50 与 S&P500
framework: tensorflow
# 独立 Python 环境路径（可选）。留空表示与后端共用解释器。
# 示例：D:/venvs/asacpl-tf2/python.exe
python_executable: null
capabilities:
  - train
  - portfolio_weights
dataset_requirements:
  - markets: [SSE50, SP500]
    modalities: [prices, covariance, tech_indicators]
    required_fields: [date, tic, close, cov_list, f1, f2, f3, f4]
    description: 论文预处理产物（00/01 notebook 输出）：长表 + 协方差序列化列 + 4 项特征
parameters:
  - name: max_episodes
    label: 训练轮数
    type: int
    default: 100
    min: 1
    max: 10000
    description: A3C 全局训练轮数（论文脚本默认 100）。
  - name: num_workers
    label: 异步 worker 数
    type: int
    default: 5
    min: 1
    max: 16
    description: 异步 Actor-Critic 并行线程数（论文脚本默认 5）。
outputs:
  result_format: StandardPortfolioResult
  artifacts:
    - 04_a3c_test_daily_return_CNN.csv
    - 04_a3c_test_weights_CNN.csv
execution:
  adapter_file: adapter.py
  original_code_subdir: ASACPL
  default_timeout_seconds: 86400
